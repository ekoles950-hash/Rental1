<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Keuangan Top Up</title>
  <!-- Library Resmi Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; border-bottom: 2px solid #ff9f43; padding-bottom: 10px; }
    
    /* Style Menu Tab Navigasi */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background-color: #e0e0e0; color: #555; transition: 0.3s; }
    .tab-btn.active { background-color: #ff9f43; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; outline: none; box-sizing: border-box; }
    
    /* Card Dashboard Monitor */
    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
    .card { background: #f8f9fa; border-left: 4px solid #ff9f43; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card.lunas { border-left-color: #25D366; }
    .card.belum { border-left-color: #dc3545; }
    .card h4 { margin: 0; color: #666; font-size: 14px; }
    .card p { margin: 5px 0 0 0; font-size: 20px; font-weight: bold; color: #333; }

    .btn-submit { background-color: #ff9f43; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; }
    .btn-submit:hover { background-color: #ee5a24; }

    .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info { display: flex; flex-direction: column; flex: 1; }
    .nama { font-weight: bold; font-size: 16px; color: #333; }
    .detail { font-size: 13px; color: #dc3545; margin-top: 4px; font-weight: bold; }
    .actions { display: flex; gap: 5px; }
    
    .btn-lunas { background-color: #25D366; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.3s; }
    .btn-lunas:hover { background-color: #1e7e34; }
    .btn-reset { background-color: #dc3545; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 25px; transition: 0.3s; }
    
    button:disabled { background-color: #ccc !important; cursor: not-allowed; }
    #loading { text-align: center; color: #666; font-style: italic; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Keuangan Top Up</h2>
    
    <!-- Tab Navigasi Menu Utama -->
    <div class="tabs">
      <button id="btn-tab-monitor" class="tab-btn active" onclick="bukaTab('monitor')">🖥️ Monitor & Antrean</button>
      <button id="btn-tab-input" class="tab-btn" onclick="bukaTab('input')">➕ Input Data Baru</button>
    </div>

    <!-- ================= TAB FITUR 1: MONITOR & DAFTAR ANTREAN ================= -->
    <div id="tab-monitor" class="tab-content active">
      <div class="dashboard-grid">
        <div class="card lunas">
          <h4>TOTAL PEMASUKAN TOP UP (LUNAS)</h4>
          <p id="dashPemasukan">Rp 0</p>
        </div>
        <div class="card belum">
          <h4>ANTREAN BELUM BAYAR</h4>
          <p id="dashBelumBayar">0 Orang</p>
        </div>
      </div>
      
      <h3 style="margin-top: 25px; font-size: 16px; color: #555;">📋 Daftar Antrean Belum Bayar:</h3>
      <div id="loading">Memuat database top up...</div>
      <div id="listAntrean"></div>
      
      <!-- TOMBOL RESET RIWAYAT PEMASUKAN -->
      <button id="btn-reset-db" class="btn-reset" onclick="resetTotalPemasukan()">🔄 Reset Semua Riwayat & Pemasukan</button>
    </div>

    <!-- ================= TAB FITUR 2: INPUT FORM DATA BARU ================= -->
    <div id="tab-input" class="tab-content">
      <div class="form-group">
        <label>Nama Pelanggan:</label>
        <input type="text" id="inputNama" placeholder="Contoh: Rosid">
      </div>
      
      <div class="form-group">
        <label>Nominal Top Up (Rp):</label>
        <input type="number" id="inputNominal" placeholder="Contoh: 50000">
      </div>

      <button id="btnSimpan" class="btn-submit" onclick="simpanBelumBayar()">Simpan Ke Antrean Belum Bayar</button>
    </div>

  </div>

  <script>
    // --- INTEGRASI KREDENSIAL SUPABASE ASLI KO EKO ---
    const SUPABASE_URL = "https://wfcmhdqtoftuyfjtyfkk.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_TE45MyojofIEUkZyvLkHmg_xnsk92Ld"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Variabel lokal pembantu kalkulasi counter pemasukan lunas berjalan di aplikasi
    let totalPemasukanLunasLokal = 0;

    function bukaTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      if(tabName === 'monitor') document.getElementById('btn-tab-monitor').classList.add('active');
      if(tabName === 'input') document.getElementById('btn-tab-input').classList.add('active');
    }

    // Ambil rekap pemasukan lokal yang tersimpan di memori browser biar tidak hilang saat refresh halaman
    if(localStorage.getItem('pemasukan_topup_lokal')) {
      totalPemasukanLunasLokal = parseInt(localStorage.getItem('pemasukan_topup_lokal')) || 0;
    }

    // --- FITUR UTAMA: BROWSE DATA ANTREAN DARI SUPABASE ---
    async function muatDataTopUp() {
      try {
        const { data, error } = await supabaseClient
          .from('management_topup')
          .select('*')
          .order('waktu_input', { ascending: true });
        
        if (error) throw error;

        document.getElementById('loading').style.display = 'none';

        let totalAntreanBelum = 0;
        const listAntrean = document.getElementById('listAntrean');
        listAntrean.innerHTML = "";

        if(data && data.length > 0) {
          data.forEach(row => {
            const idRow = row.id;
            const nama = row.nama_pelanggan;
            const nominal = parseInt(row.nominal_topup) || 0;

            totalAntreanBelum++;
            
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
              <div class="info">
                <span class="nama">${nama}</span>
                <span class="detail">Belum Bayar: Rp ${nominal.toLocaleString('id-ID')}</span>
              </div>
              <div class="actions">
                <button class="btn-lunas" onclick="setLunasTopUp('${idRow}', '${nama}', ${nominal}, this)">Set Lunas</button>
              </div>
            `;
            listAntrean.appendChild(div);
          });
        }

        if (totalAntreanBelum === 0) {
          listAntrean.innerHTML = "<div style='text-align:center; color:#25D366; padding:20px; font-weight:bold;'>✅ Antrean bersih! Semua pelanggan sudah lunas.</div>";
        }

        // Tampilkan kalkulasi total ke dashboard panel atas
        document.getElementById('dashPemasukan').innerText = `Rp ${totalPemasukanLunasLokal.toLocaleString('id-ID')}`;
        document.getElementById('dashBelumBayar').innerText = `${totalAntreanBelum} Orang`;

      } catch (e) {
        console.log("Error memuat database:", e);
      }
    }

    // --- AKSI 1: SIMPAN DATA BARU KLIEN KE ANTREAN BELUM BAYAR ---
    async function simpanBelumBayar() {
      const nama = document.getElementById('inputNama').value.trim();
      const nominal = document.getElementById('inputNominal').value.trim();
      const btn = document.getElementById('btnSimpan');

      if (!nama || !nominal) {
        alert("Nama dan Nominal wajib diisi, Ko!");
        return;
      }

      btn.innerText = "Menyimpan... ⏳";
      btn.disabled = true;

      try {
        const { error } = await supabaseClient
          .from('management_topup')
          .insert([{ nama_pelanggan: nama, nominal_topup: parseInt(nominal), status_bayar: 'BELUM BAYAR' }]);

        if (error) throw error;

        document.getElementById('inputNama').value = "";
        document.getElementById('inputNominal').value = "";
        
        muatDataTopUp();
        bukaTab('monitor'); 

      } catch (e) {
        alert("Gagal menyimpan data: " + e.message);
      } finally {
        btn.innerText = "Simpan Ke Antrean Belum Bayar";
        btn.disabled = false;
      }
    }

    // --- AKSI 2: SET LUNAS (PINDAH KE PEMASUKAN DAN OTOMATIS HAPUS DARI ANTREAN) ---
    async function setLunasTopUp(id, nama, nominal, btn) {
      if (!confirm(`Set Lunas untuk ${nama} senilai Rp ${nominal.toLocaleString('id-ID')}?`)) return;
      btn.innerText = "...";
      btn.disabled = true;

      try {
        // Eksekusi penghapusan baris data langsung dari database Supabase sesuai ID target
        const { error } = await supabaseClient
          .from('management_topup')
          .delete()
          .eq('id', id);

        if (error) throw error;

        // Tambahkan nominal uang ke dalam akumulasi Pemasukan Lunas Utama
        totalPemasukanLunasLokal += parseInt(nominal);
        localStorage.setItem('pemasukan_topup_lokal', totalPemasukanLunasLokal);

        // Muat ulang dashboard: nominal pemasukan naik, nama otomatis hilang bersih!
        muatDataTopUp();

      } catch (e) {
        alert("Gagal memproses lunas: " + e.message);
        btn.innerText = "Set Lunas";
        btn.disabled = false;
      }
    }

    // --- AKSI 3: RESET DATABASE DAN TOTAL PEMASUKAN ---
    async function resetTotalPemasukan() {
      const konfirmasi = prompt("⚠️ PERINGATAN REKAP DATA!\nTindakan ini akan mengosongkan antrean dan menyetel ulang pemasukan kembali ke Rp 0.\n\nKetik kata 'RESET' untuk melanjutkan:");
      if (konfirmasi !== "RESET") {
        alert("Reset dibatalkan.");
        return;
      }

      const btn = document.getElementById('btn-reset-db');
      btn.innerText = "Mengosongkan... ⏳";
      btn.disabled = true;

      try {
        await supabaseClient.from('management_topup').delete().neq('nama_pelanggan', 'KOLOM_KOSONG_IMPOSSIBLE_X');
        
        totalPemasukanLunasLokal = 0;
        localStorage.removeItem('pemasukan_topup_lokal');
        
        alert("Aplikasi top up berhasil disetel ulang murni ke awal!");
        muatDataTopUp();
      } catch (e) {
        alert("Gagal mereset: " + e.message);
      } finally {
        btn.innerText = "🔄 Reset Semua Riwayat & Pemasukan";
        btn.disabled = false;
      }
    }

    muatDataTopUp();
    setInterval(muatDataTopUp, 5000); // Auto-refresh sinkronisasi data setiap 5 detik
  </script>
</body>
</html>
