
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sengkuni Neon Pro</title>
    <style>
        :root { --neon: #00ff00; --bg: #050505; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 10px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 400px; background: #111; padding: 20px; border-radius: 25px; border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        h2 { color: var(--neon); text-shadow: 0 0 10px var(--neon); text-align: center; }
        input, textarea, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        #gasBtn { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .part-item { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-top: 10px; border-left: 5px solid var(--neon); text-align: left; }
        .yt-btn { background: #ff0000; border: none; font-weight: bold; cursor: pointer; }
        video { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎬 SENGKUNI NEON</h2>
    <input type="text" id="y_title" placeholder="Judul Dasar...">
    <textarea id="y_desc" placeholder="Caption/Subtitle..."></textarea>
    
    <div style="border: 2px dashed var(--neon); padding: 15px; margin: 10px 0; border-radius: 15px;" onclick="document.getElementById('videoInput').click()">
        <span style="color:var(--neon)">📁 PILIH VIDEO</span>
        <input type="file" id="videoInput" accept="video/*" style="display:none;">
    </div>

    <button id="gasBtn" style="display:none;">GAS POTONG & NEON!</button>
    <div id="status" style="font-size:12px; color:var(--neon); margin: 10px 0;"></div>
    <div id="resultArea"></div>
</div>

<video id="vSource"></video>

<script>
    const vIn = document.getElementById('videoInput');
    const vSrc = document.getElementById('vSource');
    const gasBtn = document.getElementById('gasBtn');
    const resArea = document.getElementById('resultArea');

    vIn.onchange = (e) => {
        if(e.target.files[0]) {
            vSrc.src = URL.createObjectURL(e.target.files[0]);
            gasBtn.style.display = "block";
            document.getElementById('status').innerText = "Video Terpilih: " + e.target.files[0].name;
        }
    };

    gasBtn.onclick = async () => {
        gasBtn.disabled = true;
        resArea.innerHTML = "";
        let start = 0; let part = 1;
        while (start < vSrc.duration) {
            document.getElementById('status').innerText = `⏳ Memproses PART ${part} + Efek Neon...`;
            const end = Math.min(start + 60, vSrc.duration);
            const blob = await processNeon(start, end);
            addPart(part, blob);
            start += 60; part++;
        }
        document.getElementById('status').innerText = "✅ SEMUA PART SIAP!";
        gasBtn.disabled = false;
    };

    function addPart(num, blob) {
        const item = document.createElement('div');
        item.className = 'part-item';
        item.innerHTML = `<b>PART ${num} (NEON OK)</b>`;
        const yt = document.createElement('button');
        yt.className = 'yt-btn'; yt.innerText = "🚀 GAS YOUTUBE";
        yt.onclick = () => {
            yt.innerText = "⏳ UPLOADING..."; yt.disabled = true;
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const fd = new FormData();
                fd.append('video_data', reader.result.split(',')[1]);
                fd.append('title', document.getElementById('y_title').value + " #Part" + num);
                fd.append('desc', document.getElementById('y_desc').value);
                fd.append('privacy', 'public');
                const res = await fetch('', { method: 'POST', body: fd });
                const text = await res.text();
                yt.innerText = text === "BERHASIL" ? "✅ TERKIRIM" : "❌ GAGAL";
            };
        };
        item.appendChild(yt);
        resArea.appendChild(item);
    }

    // --- FUNGSI SAKTI: POTONG + BINGKAI NEON + SUBTITLE ---
    async function processNeon(s, e) {
        return new Promise((res) => {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width = 720; cvs.height = 1280; // Ukuran 9:16 Shorts
            vSrc.currentTime = s;
            vSrc.onseeked = () => {
                const stream = cvs.captureStream(30);
                const rc = new MediaRecorder(stream, { mimeType: 'video/webm' });
                const chnk = [];
                rc.ondataavailable = x => chnk.push(x.data);
                rc.onstop = () => res(new Blob(chnk, {type:'video/mp4'}));
                
                const draw = () => {
                    if(vSrc.currentTime < e && !vSrc.paused) {
                        // 1. Gambar Video Asli (Crop Tengah)
                        const r = 1280/vSrc.videoHeight; const nw = vSrc.videoWidth*r;
                        ctx.drawImage(vSrc, -(nw-720)/2, 0, nw, 1280);

                        // 2. GAMBAR BINGKAI NEON (Lampu Hijau)
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 20; // Ketebalan bingkai
                        ctx.shadowBlur = 20; // Efek cahaya neon
                        ctx.shadowColor = '#00ff00';
                        ctx.strokeRect(10, 10, 700, 1260);

                        // 3. GAMBAR SUBTITLE (Teks di Tengah Bawah)
                        const subTeks = document.getElementById('y_desc').value;
                        if(subTeks) {
                            ctx.font = "bold 40px Arial";
                            ctx.fillStyle = "white";
                            ctx.textAlign = "center";
                            ctx.shadowBlur = 10; ctx.shadowColor = "black";
                            ctx.fillText(subTeks, 360, 1150); // Posisi subtitle
                        }

                        requestAnimationFrame(draw);
                    } else { rc.stop(); }
                };
                rc.start(); vSrc.play(); draw();
                setTimeout(() => { vSrc.pause(); if(rc.state === "recording") rc.stop(); }, (e-s)*1000);
            };
        });
    }
</script>
</body>
</html>
