<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sengkuni Cutter - Suara Fix</title>
    <style>
        :root { --neon: #00ff00; --bg: #050505; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 15px; text-align: center; }
        .card { max-width: 420px; margin: auto; background: #111; padding: 25px; border-radius: 25px; border: 1px solid var(--neon); }
        .upload-area { border: 2px dashed #444; padding: 25px; border-radius: 15px; cursor: pointer; color: var(--neon); margin: 20px 0; }
        #gasBtn { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: bold; background: var(--neon); color: #000; cursor: pointer; display: none; }
        .part-item { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--neon); }
        .dl-btn { background: var(--neon); color: #000; padding: 10px 15px; border-radius: 10px; font-weight: bold; text-decoration: none; font-size: 12px; }
        video { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:var(--neon); font-style: italic;">🎬 SENGKUNI FIX SUARA</h2>
    <div class="upload-area" onclick="document.getElementById('videoInput').click()">
        📁 PILIH VIDEO
        <input type="file" id="videoInput" accept="video/*" style="display:none;">
    </div>
    <button id="gasBtn">MULAI POTONG PART</button>
    <div id="status" style="margin-top:10px; color:var(--neon); font-size:12px;">Ready Mas Eko!</div>
    <div id="resultArea"></div>
</div>

<video id="vSource"></video>

<script>
    const vIn = document.getElementById('videoInput');
    const vSrc = document.getElementById('vSource');
    const gasBtn = document.getElementById('gasBtn');
    const status = document.getElementById('status');
    const resArea = document.getElementById('resultArea');

    vIn.onchange = (e) => {
        if(e.target.files[0]) {
            vSrc.src = URL.createObjectURL(e.target.files[0]);
            gasBtn.style.display = "block";
            status.innerText = "Video siap dipotong!";
        }
    };

    gasBtn.onclick = async () => {
        gasBtn.disabled = true;
        resArea.innerHTML = "";
        let start = 0; let part = 1;
        while (start < vSrc.duration) {
            status.innerText = `⏳ Memproses PART ${part} (Cek Suara)...`;
            const end = Math.min(start + 60, vSrc.duration);
            const blob = await convert916(start, end);
            addPart(part, blob);
            start += 60; part++;
        }
        status.innerText = "✅ SEMUA PART BERES!";
        gasBtn.disabled = false;
    };

    function addPart(num, blob) {
        const url = URL.createObjectURL(blob);
        const item = document.createElement('div');
        item.className = 'part-item';
        item.innerHTML = `<div><strong>PART ${num}</strong></div><a href="${url}" download="Part_${num}.mp4" class="dl-btn">💾 SIMPAN</a>`;
        resArea.appendChild(item);
    }

    async function convert916(s, e) {
        return new Promise((res) => {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width = 720; cvs.height = 1280;
            vSrc.currentTime = s;

            vSrc.onseeked = async () => {
                // JEDA 500ms biar Audio Engine browser "bangun" di posisi baru
                await new Promise(r => setTimeout(r, 500));

                const aCtx = new AudioContext();
                const src = aCtx.createMediaElementSource(vSrc);
                const dst = aCtx.createMediaStreamDestination();
                src.connect(dst); src.connect(aCtx.destination);
                
                const strm = new MediaStream([...cvs.captureStream(30).getVideoTracks(), ...dst.stream.getAudioTracks()]);
                const rc = new MediaRecorder(strm, { mimeType: 'video/webm' });
                const chnk = [];
                
                rc.ondataavailable = x => chnk.push(x.data);
                rc.onstop = () => { aCtx.close(); res(new Blob(chnk, {type:'video/mp4'})); };
                
                const draw = () => {
                    if(vSrc.currentTime < e && !vSrc.paused) {
                        const r = 1280/vSrc.videoHeight; const nw = vSrc.videoWidth*r;
                        ctx.drawImage(vSrc, -(nw-720)/2, 0, nw, 1280);
                        requestAnimationFrame(draw);
                    } else { rc.stop(); }
                };
                
                rc.start(); vSrc.play(); draw();
                setTimeout(() => { if(rc.state === "recording") { vSrc.pause(); rc.stop(); } }, (e-s + 1) * 1000);
            };
        });
    }
</script>
</body>
</html>
