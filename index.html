<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sengkuni TikTok - Ringan</title>
    <style>
        :root { --neon: #00ff00; --bg: #050505; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 15px; text-align: center; }
        .card { max-width: 400px; margin: auto; background: #111; padding: 25px; border-radius: 20px; border: 1px solid var(--neon); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; background: var(--neon); color: #000; cursor: pointer; }
        .part-item { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--neon); }
        .unduh { background: var(--neon); color: #000; padding: 8px 15px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 12px; }
        video { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:var(--neon)">🎬 TIKTOK SUBTITLE</h2>
    <input type="text" id="subText" placeholder="Teks Subtitle (Bawah)">
    <div style="border:2px dashed #333; padding:20px; margin:10px 0; border-radius:10px;" onclick="document.getElementById('videoInput').click()">
        📁 KLIK PILIH VIDEO
        <input type="file" id="videoInput" accept="video/*" style="display:none">
    </div>
    <button id="gasBtn" class="btn" style="display:none">GAS POTONG + SUBTITLE</button>
    <div id="status" style="font-size:12px; margin-top:10px; color:var(--neon)">Ready Mas Eko!</div>
    <div id="resultArea"></div>
</div>

<video id="vSource"></video>

<script>
    const vIn = document.getElementById('videoInput');
    const vSrc = document.getElementById('vSource');
    const gasBtn = document.getElementById('gasBtn');
    const status = document.getElementById('status');
    const resArea = document.getElementById('resultArea');

    vIn.onchange = (e) => {
        if(e.target.files[0]) {
            vSrc.src = URL.createObjectURL(e.target.files[0]);
            gasBtn.style.display = "block";
            status.innerText = "Video siap diproses!";
        }
    };

    gasBtn.onclick = async () => {
        gasBtn.disabled = true;
        resArea.innerHTML = "";
        let start = 0; let part = 1;
        const sub = document.getElementById('subText').value;

        while (start < vSrc.duration) {
            status.innerText = `⏳ Memproses PART ${part}...`;
            const end = Math.min(start + 60, vSrc.duration);
            
            // JEDA ISTIRAHAT RAM (1 Detik) biar gak stuck
            await new Promise(r => setTimeout(r, 1000));
            
            try {
                const blob = await processVideo(start, end, sub);
                addPart(part, blob);
                start += 60; part++;
            } catch (e) {
                status.innerText = "❌ Memori HP Penuh, kurangi durasi!";
                break;
            }
        }
        status.innerText = "✅ SEMUA SELESAI!";
        gasBtn.disabled = false;
    };

    function addPart(num, blob) {
        const url = URL.createObjectURL(blob);
        const div = document.createElement('div');
        div.className = 'part-item';
        div.innerHTML = `<div>PART ${num}</div><a href="${url}" download="Sengkuni_${num}.mp4" class="unduh">UNDUH</a>`;
        resArea.appendChild(div);
    }

    async function processVideo(s, e, text) {
        return new Promise((res) => {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width = 720; cvs.height = 1280; // Resolusi standar Shorts
            vSrc.currentTime = s;

            vSrc.onseeked = () => {
                const aCtx = new AudioContext();
                const src = aCtx.createMediaElementSource(vSrc);
                const dst = aCtx.createMediaStreamDestination();
                src.connect(dst); src.connect(aCtx.destination);
                
                const strm = new MediaStream([...cvs.captureStream(25).getVideoTracks(), ...dst.stream.getAudioTracks()]);
                const rc = new MediaRecorder(strm, { mimeType: 'video/webm' });
                const chnk = [];
                
                rc.ondataavailable = x => chnk.push(x.data);
                rc.onstop = () => { aCtx.close(); res(new Blob(chnk, {type:'video/mp4'})); };
                
                const draw = () => {
                    if(vSrc.currentTime < e && !vSrc.paused) {
                        const r = 1280/vSrc.videoHeight; const nw = vSrc.videoWidth*r;
                        ctx.drawImage(vSrc, -(nw-720)/2, 0, nw, 1280);
                        
                        // GAMBAR SUBTITLE
                        ctx.fillStyle = "rgba(0,0,0,0.5)";
                        ctx.fillRect(50, 1100, 620, 100);
                        ctx.fillStyle = "#fff"; ctx.font = "bold 40px sans-serif";
                        ctx.textAlign = "center";
                        ctx.fillText(text, 360, 1165);
                        
                        requestAnimationFrame(draw);
                    } else { rc.stop(); }
                };
                rc.start(); vSrc.play(); draw();
                setTimeout(() => { if(rc.state === "recording") { vSrc.pause(); rc.stop(); } }, (e-s + 2) * 1000);
            };
        });
    }
</script>
</body>
</html>
